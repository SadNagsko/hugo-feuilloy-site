ServerTokens Prod
ServerSignature Off
AddDefaultCharset UTF-8
AddType font/woff2 .woff2
AddType application/javascript .js
AddType text/css .css
AddType image/webp .webp
AddType application/xml .xml

# Seul api/public est exposé ; vendor/ et .env restent hors de la racine web.
Alias /api /var/www/api/public
<Directory /var/www/api/public>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

ErrorDocument 404 /index.html

# Variables Coolify transmises à PHP (getenv)
PassEnv SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS CONTACT_TO MAIL_FROM_NAME ALLOWED_ORIGINS

<IfModule mod_headers.c>
    # 1. CSP : tout vient du site lui-même, aucun script en ligne ; protection contre le Clickjacking
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"
    Header always set X-Frame-Options "SAMEORIGIN"

    # 2. Forcer HTTPS (HSTS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # 3. Protection contre le MIME-Sniffing
    Header always set X-Content-Type-Options "nosniff"

    # 4. Pas d'URL complète transmise aux sites tiers ; API navigateur inutilisées désactivées
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # 5. Gestion du cache différenciée
    # Fichiers statiques non versionnés (polices, images, robots, sitemap) : 7 jours
    <FilesMatch "\.(css|js|woff2|webp|jpg|jpeg|png|svg|ico|txt|xml)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    # Pages HTML : toujours revalidées, pour que chaque déploiement soit visible immédiatement
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # API : jamais mise en cache
    <FilesMatch "\.php$">
        Header set Cache-Control "no-store"
    </FilesMatch>
</IfModule>

# Fichiers versionnés par Vite (nom avec empreinte) : cache immuable 1 an
<LocationMatch "^/assets/">
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</LocationMatch>

