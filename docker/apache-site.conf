ServerTokens Prod
ServerSignature Off
AddDefaultCharset UTF-8

# Seul api/public est exposé ; vendor/ et .env restent hors de la racine web.
Alias /api /var/www/api/public
<Directory /var/www/api/public>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

ErrorDocument 404 /index.html

# Variables Coolify transmises à PHP (getenv)
PassEnv SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS CONTACT_TO MAIL_FROM_NAME ALLOWED_ORIGINS

<IfModule mod_headers.c>
    # 1. Protection contre le détournement de clic (Clickjacking) & CSP
    Header always set Content-Security-Policy "frame-ancestors 'self';"
    Header always set X-Frame-Options "SAMEORIGIN"

    # 2. Forcer HTTPS (HSTS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # 3. Protection contre le MIME-Sniffing
    Header always set X-Content-Type-Options "nosniff"

    # 6. Gestion du cache différenciée
    # Assets statiques / hashés (JS, CSS, images, polices) : cache immuable 1 an
    <FilesMatch "\.(css|js|woff2|webp|jpg|jpeg|png|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # Documents HTML & PHP : toujours revalider pour permettre le rafraîchissement des déploiements
    <FilesMatch "\.(html|php)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
</IfModule>

